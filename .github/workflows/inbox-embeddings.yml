name: Inbox Embeddings Generator

on:
  # Only same-repo runs of the upstream pipeline on main (job `if:`); code is checked out
  # from the default branch, never from the triggering run's head.
  workflow_run: # zizmor: ignore[dangerous-triggers] -- guarded: main + same repo only
    workflows: ['Inbox Ingest Pipeline']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reindex_all:
        description: 'Reindex all entries (not just new ones)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: inbox-embeddings
  cancel-in-progress: false
  queue: max # keep every pending run (incl. reindex_all); default queue replaces pending runs

jobs:
  generate-embeddings:
    name: Generate semantic embeddings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    permissions:
      contents: read # checkout
      actions: write # dispatch mda-categorize.yml

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # Full dependency tree pinned by .github/deps/inbox-embeddings/package-lock.json.
      - name: Install embedding dependencies
        run: |
          npm ci --prefix .github/deps/inbox-embeddings --no-audit --no-fund
          mv .github/deps/inbox-embeddings/node_modules ./node_modules

      - name: Run embedding generation
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REINDEX_ALL: ${{ inputs.reindex_all || 'false' }}
        run: node scripts/inbox-embeddings.mjs

      - name: Trigger MDA categorization
        if: success()
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          workflow: mda-categorize.yml
          ref: ${{ github.ref_name }}
          token: ${{ github.token }}
