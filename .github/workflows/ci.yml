name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
      - dev
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  pull_request:
    branches:
      - main
      - master
      - develop
      - dev
    paths-ignore:
      - "docs/**"
      - "LICENSE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block tracked env files
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$|\.env\.local$|\.env\.prod$' ; then
            echo "::err::Secret env files must not be committed. Remove from git and add to .gitignore."
            exit 1
          fi
          echo "No .env files tracked."

  changes:
    runs-on: ubuntu-latest
    outputs:
      forge: ${{ steps.filter.outputs.forge }}
      generative: ${{ steps.filter.outputs.generative }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            forge:
              - 'next-forge/**'
            generative:
              - 'GenerativeUI_monorepo/**'
            rootLegacy:
              - 'src/**'
              - 'agent/**'
            orchestration:
              - 'scripts/**'
              - 'docs/**'
              - '.cursor/**'
              - '.agents/**'
              - '.github/**'
              - 'harness/**'
              - 'package.json'
              - 'CHANGELOG.md'
              - 'e2e/worktree-smoke/**'
              - '.githooks/**'
            harness:
              - 'harness/**'
              - 'docs/ECL.md'
              - 'docs/STATUS.md'
              - 'docs/ARCHITECTURE.md'
              - 'C4-Documentation/**'
            e2e:
              - 'next-forge/tests/e2e/**'
              - 'next-forge/playwright.config.ts'
              - 'next-forge/packages/schemas/ws-contract.test.ts'
              - 'next-forge/packages/schemas/molecule-index.test.ts'
              - 'scripts/molecule-index-orchestrator.mjs'
              - 'scripts/__tests__/molecule-index.test.mjs'
              - 'data/molecule-index/**'
            moleculeContract:
              - 'next-forge/packages/schemas/**'
              - 'packages/intake-contracts/**'
              - 'scripts/molecule-index*.mjs'
              - 'scripts/__tests__/molecule-index.test.mjs'
              - 'data/molecule-index/**'

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate CHANGELOG
        run: node scripts/validate-changelog.mjs
      - name: Require CHANGELOG update when needed
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/validate-changelog.mjs --require-update

  generative-ui:
    needs: [secret-guard, changes]
    if: needs.changes.outputs.generative == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GenerativeUI_monorepo
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: GenerativeUI_monorepo/yarn.lock
      - name: Enable Corepack (Yarn 3)
        run: corepack enable
      - name: Install deps
        run: yarn install --immutable 2>/dev/null || yarn install
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build

  next-forge:
    needs: [secret-guard, changes]
    if: needs.changes.outputs.forge == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next-forge
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: next-forge/pkg.json
      - name: Install deps
        run: bun install --frozen-lockfile
      - name: Check (Ultracite/Biome)
        run: bun run check
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build

  worktree-smoke:
    needs: [secret-guard]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: orch_filter
        with:
          filters: |
            orchestration:
              - 'scripts/**'
              - 'docs/**'
              - '.cursor/**'
              - '.agents/**'
              - '.github/**'
              - 'harness/**'
              - 'package.json'
              - 'CHANGELOG.md'
              - 'e2e/worktree-smoke/**'
              - '.githooks/**'
      - name: Worktree orchestration smoke
        if: steps.orch_filter.outputs.orchestration == 'true' || github.event_name == 'workflow_dispatch'
        run: node e2e/worktree-smoke/run.mjs
      - name: Skip (no orchestration paths)
        if: steps.orch_filter.outputs.orchestration != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "worktree-smoke skipped — no orchestration path changes"

  nix-orchestration-smoke:
    needs: [secret-guard]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: nix_filter
        with:
          filters: |
            orchestration:
              - 'scripts/**'
              - 'flake.nix'
              - 'flake.lock'
              - 'e2e/worktree-smoke/**'
              - 'package.json'
      - uses: DeterminateSystems/nix-installer-action@main
        if: steps.nix_filter.outputs.orchestration == 'true' || github.event_name == 'workflow_dispatch'
      - name: Nix devShell worktree smoke
        if: steps.nix_filter.outputs.orchestration == 'true' || github.event_name == 'workflow_dispatch'
        run: nix develop -c node e2e/worktree-smoke/run.mjs
      - name: Skip (no orchestration paths)
        if: steps.nix_filter.outputs.orchestration != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "nix-orchestration-smoke skipped — no orchestration path changes"