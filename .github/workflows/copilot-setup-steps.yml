name: Copilot Setup Steps

on:
  workflow_dispatch:

jobs:
  # The job MUST be called 'copilot-setup-steps' to be recognized by GitHub Copilot Agent
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install gh-aw extension
        uses: github/gh-aw-actions/setup-cli@c0338fef4749d08c21f8f975fb0e37efa17dda47

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate Copilot workspace env
        run: node scripts/copilot-workspace/generate-env.mjs

      - name: Preflight env profile
        run: node scripts/preflight.mjs --profile env

      - name: Validate Obsidian clipper templates
        run: node scripts/knowledge-management/export-obsidian-clipper.mjs
