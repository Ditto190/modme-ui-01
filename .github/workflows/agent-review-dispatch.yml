# Path-routed agent review dispatch (GitLab multi-approval-rule parity).
# SoT: .github/agent-codeowners.yml — humans are not required CODEOWNERS.

name: Agent review dispatch

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

concurrency:
  group: agent-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: write

jobs:
  resolve:
    name: Resolve agent roles
    runs-on: ubuntu-latest
    outputs:
      roles: ${{ steps.match.outputs.roles }}
      roles_empty: ${{ steps.match.outputs.roles_empty }}
      unmatched_required: ${{ steps.match.outputs.unmatched_required }}
      labels: ${{ steps.match.outputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@39370e3970a6d050c5454d0f4e42e01109a1e5d3 # v4.1.0
        with:
          node-version: "20"

      - name: Collect changed paths
        id: paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > /tmp/changed-paths.txt || true
          else
            git diff --name-only HEAD~1 HEAD > /tmp/changed-paths.txt || true
          fi
          if [ ! -s /tmp/changed-paths.txt ]; then
            echo "package.json" > /tmp/changed-paths.txt
          fi
          echo "Changed paths:"
          cat /tmp/changed-paths.txt

      - name: Match agent-codeowners
        id: match
        run: |
          set -euo pipefail
          npm install --no-save js-yaml@4.1.0
          node scripts/lib/agent-codeowners.mjs --paths-file /tmp/changed-paths.txt --github-output >> "$GITHUB_OUTPUT"
          echo "Matched outputs written."

      - name: Apply review:* labels
        if: github.event_name == 'pull_request' && steps.match.outputs.roles_empty != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ steps.match.outputs.labels }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          IFS=',' read -ra LABEL_ARR <<< "$LABELS"
          for label in "${LABEL_ARR[@]}"; do
            [ -z "$label" ] && continue
            gh label create "$label" --force --color "0E8A16" --description "Agent review role" 2>/dev/null || true
            gh pr edit "$PR" --add-label "$label" || true
          done

  review:
    name: Role matrix
    needs: resolve
    if: needs.resolve.outputs.roles_empty != 'true' && needs.resolve.outputs.roles != '["__none__"]'
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.resolve.outputs.roles) }}
    uses: ./.github/workflows/_agent-role-review.yml
    with:
      role: ${{ matrix.role }}
      skipped: false

  skip-unmatched:
    name: Skip unmatched required
    needs: resolve
    if: always() && needs.resolve.outputs.unmatched_required != '[]' && needs.resolve.outputs.unmatched_required != ''
    strategy:
      fail-fast: false
      matrix:
        role: ${{ fromJson(needs.resolve.outputs.unmatched_required) }}
    uses: ./.github/workflows/_agent-role-review.yml
    with:
      role: ${{ matrix.role }}
      skipped: true
