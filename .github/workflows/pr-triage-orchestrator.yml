name: PR Triage Orchestrator

on:
  schedule:
    cron: "0 14 * * 1-5"
  workflow_dispatch:
    inputs:
      base:
        description: "Base branch filter for dev queue"
        required: false
        default: dev
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  triage:
    name: PR triage (recommendation mode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run triage pipeline
        run: node scripts/pr-triage/run-triage.mjs --json > /tmp/triage-full.json

      - name: Validate changelog
        continue-on-error: true
        run: node scripts/validate-changelog.mjs

      - name: Build triage issue body
        id: body
        run: |
          DATE=$(date -u +%Y-%m-%d)
          MD="docs/pr-resolution/reports/triage-${DATE}.md"
          if [ -f "$MD" ]; then
            echo "path=$MD" >> $GITHUB_OUTPUT
            cat "$MD" >> /tmp/issue-body.md
          else
            echo "No markdown report generated" > /tmp/issue-body.md
          fi

      - name: Create or update triage issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const date = new Date().toISOString().slice(0, 10);
            const title = `[PR Triage] ${date}`;
            const body = fs.readFileSync('/tmp/issue-body.md', 'utf8');
            const footer = '\n\n<!-- pr-triage-orchestrator -->\n';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'pr-triage',
              per_page: 5,
            });
            const existing = issues.find(i => i.title === title);
            const labels = ['pr-triage', 'stack:orchestration'];
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body + footer,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: body + footer,
                labels,
              });
            }

      - name: Upload triage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pr-triage-${{ github.run_id }}
          path: |
            /tmp/triage-full.json
            docs/pr-resolution/reports/

  compat-scan:
    name: Agent compatibility scan (matrix)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: [".", "next-forge", "GenerativeUI_monorepo"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run agent-compatibility
        continue-on-error: true
        run: |
          npx -y agent-compatibility@latest --json "${{ matrix.path }}" > "compat-${{ matrix.path == '.' && 'root' || matrix.path }}.json" || echo '{"score":0,"error":"scan failed"}' > "compat-${{ matrix.path == '.' && 'root' || matrix.path }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: compat-${{ matrix.path == '.' && 'root' || matrix.path }}
          path: compat-*.json
