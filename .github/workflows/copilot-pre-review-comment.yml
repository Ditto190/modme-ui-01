name: "Copilot Pre-Review — PR Comment"

on:
  # Privileged follow-up to an unprivileged PR gate (fork PRs included). The artifact is
  # treated as hostile: read in-script (never via $GITHUB_OUTPUT), size-capped, the PR number
  # must match an open PR whose head SHA equals the triggering run's head SHA, and nothing
  # from the PR is checked out or executed.
  workflow_run: # zizmor: ignore[dangerous-triggers] -- guarded as described above
    workflows: ["Copilot Pre-Review — PR Gate"]
    types: [completed]

permissions: {}

concurrency:
  group: copilot-pre-review-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post pre-review results as PR comment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: read # download the gate run's artifact
      pull-requests: write # create/update the pre-review comment

    steps:
      - name: Download pre-review artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: copilot-pre-review-results
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pre-review

      - name: Post or update PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/pre-review
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = process.env.ARTIFACT_DIR;
            const MAX = 20000;
            const read = (name) => {
              try {
                const buf = fs.readFileSync(path.join(dir, name));
                return buf.subarray(0, MAX).toString('utf8');
              } catch {
                return '';
              }
            };

            const prRaw = read('pr-number.txt').trim();
            if (!/^[0-9]{1,9}$/.test(prRaw)) {
              core.warning('Artifact PR number missing or not numeric; skipping.');
              return;
            }
            const prNumber = Number(prRaw);

            // The PR must be open and its head must be the commit the gate ran on.
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            if (pr.state !== 'open' || pr.head.sha !== process.env.HEAD_SHA) {
              core.warning(`PR #${prNumber} does not match the triggering run head; skipping.`);
              return;
            }

            const rawStatus = read('status.txt').trim();
            const status = ['OK', 'FAIL', 'SKIPPED'].includes(rawStatus) ? rawStatus : 'UNKNOWN';
            const resources = read('changed-resources.txt')
              .split('\n')
              .map((l) => l.replace(/`/g, "'").trim())
              .filter(Boolean)
              .slice(0, 200)
              .join('\n');

            const marker = '<!-- copilot-pre-review -->';
            const statusEmoji = status === 'OK' ? '✅' : status === 'FAIL' ? '❌' : '⚠️';
            const resourceBlock = resources ? '```\n' + resources + '\n```' : '_(none)_';

            const body = [
              marker,
              '## Copilot Pre-Review Report',
              '',
              `**Status:** ${statusEmoji} ${status}`,
              '',
              '### Changed agent/LLM resources',
              resourceBlock,
              '',
              '_Powered by the [Copilot Pre-Review Gate](.github/workflows/copilot-pre-review-gate.yml) workflow._',
              '_Review checklist: [`agents/review/code-review-rubric.md`](agents/review/code-review-rubric.md)_',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker) && c.user && c.user.type === 'Bot',
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing pre-review comment (id=${existing.id}) on PR #${prNumber}.`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
              core.info(`Created new pre-review comment on PR #${prNumber}.`);
            }
