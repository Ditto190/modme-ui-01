automation:
  auto_issue_session: true
  remote_control: true

branch:
  prefix: feature/copilot/

system-prompt:
  include:
    - AGENTS.md
    - .github/copilot-instructions.md
    - docs/multi-agent-worktrees.md
    - docs/copilot-workspace-orchestration.md

scripts:
  session.create:
    command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/copilot-workspace/lifecycle.ps1
  session.archive:
    command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/copilot-workspace/lifecycle.ps1
  run:
    bootstrap:
      command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/copilot-workspace/bootstrap.ps1
    preflight:fast:
      command: node scripts/preflight.mjs --profile fast
    preflight:env:
      command: node scripts/preflight.mjs --profile env
    preflight:copilot:
      command: node scripts/preflight.mjs --profile copilot-workspace
    dev:forge:core:
      command: yarn dev:forge:core
    dev:forge:docs:
      command: yarn dev:forge:docs
    dev:forge:storybook:
      command: yarn dev:forge:storybook
    agent:status:
      command: yarn agent:status
    workbench:
      command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/copilot-workspace/run-workbench.ps1
    builders:ensure:
      command: node scripts/builders-orchestrator.mjs ensure
    builders:verify:
      command: node scripts/builders-orchestrator.mjs verify
    builders:build:
      command: node scripts/builders-orchestrator.mjs build
    builders:swc:
      command: node scripts/builders-orchestrator.mjs build --builder swc
    builders:vite:build:
      command: node scripts/builders-orchestrator.mjs build --builder vite
    builders:vite:dev:
      command: node scripts/builders-orchestrator.mjs dev vibe-web-app
    builders:dolt:status:
      command: node scripts/builders-orchestrator.mjs dolt-status
    builders:pipeline:
      command: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/copilot-workspace/run-builders.ps1
