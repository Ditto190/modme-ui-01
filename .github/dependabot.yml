# Dependabot — dual monorepo + GitHub Actions
# https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/GenerativeUI_monorepo"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - stack:orchestration
    groups:
      npm_and_yarn:
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /next-forge
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - stack:forge
    groups:
      forge_bun:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci-cd
